name: Build and Deploy to itch.io

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.5.1
  # NB: the itch username ("nr") differs from the GitHub org ("near").
  ITCH_USER: best-coder-open-now-nr-me
  ITCH_GAME: escape-work
  ITCH_CHANNEL: html5

jobs:
  # Build runs inside the Godot image. This is the NON-mono image on purpose:
  # Godot 4 cannot export to Web from a C#/.NET editor build.
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The image ships export templates under /root, but the job does not run
      # as root, so Godot cannot find them until they are moved into HOME.
      - name: Install export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      # .godot/ is gitignored, so a fresh checkout has no import cache.
      - name: Import resources
        run: godot --headless --import --quit

      - name: Export web build
        run: |
          mkdir -v -p build/web
          godot --headless --verbose --export-release "Web" build/web/index.html

      - name: Fail early if the export produced nothing
        run: test -s build/web/index.html || { echo "Web export produced no index.html"; exit 1; }

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

  # Deploy runs on a plain runner rather than the Godot container, so we are not
  # relying on that image happening to ship curl/unzip.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: Install butler
        run: |
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler-bin
          chmod +x butler-bin/butler
          ./butler-bin/butler -V

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          ./butler-bin/butler push build/web \
            "${ITCH_USER}/${ITCH_GAME}:${ITCH_CHANNEL}"
