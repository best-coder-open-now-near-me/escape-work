name: Build and Deploy to itch.io

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  # The project id is shown on the project's page in PlayCanvas (and in the
  # editor URL). Scenes are resolved from it at build time, so only this is
  # needed here.
  PC_PROJECT_ID: ""
  PC_APP_NAME: "Escape Work"
  # NB: the itch username ("nr") differs from the GitHub org ("near").
  ITCH_USER: best-coder-open-now-nr-me
  ITCH_GAME: escape-work
  ITCH_CHANNEL: html5

jobs:
  # Scenes and scripts live in PlayCanvas's cloud, not in this repo, so there is
  # nothing here to compile. This job asks PlayCanvas to export a self-hosted
  # web build and hands the files to deploy, which is unchanged from the Godot
  # pipeline: butler pushes a directory and does not care what produced it.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve scene id
        env:
          PC_TOKEN: ${{ secrets.PLAYCANVAS_API_TOKEN }}
        run: |
          test -n "${PC_PROJECT_ID}" || { echo "PC_PROJECT_ID is not set"; exit 1; }
          scenes=$(curl -sfS -H "Authorization: Bearer ${PC_TOKEN}" \
            "https://playcanvas.com/api/projects/${PC_PROJECT_ID}/scenes")
          scene_id=$(echo "${scenes}" | jq -r '.result[0].id')
          test -n "${scene_id}" && test "${scene_id}" != "null" || {
            echo "No scenes on project ${PC_PROJECT_ID}: ${scenes}"; exit 1; }
          echo "SCENE_ID=${scene_id}" >> "$GITHUB_ENV"
          echo "Building scene ${scene_id}"

      - name: Request web build
        env:
          PC_TOKEN: ${{ secrets.PLAYCANVAS_API_TOKEN }}
        run: |
          # Returns 201 with a job object; the export itself runs async.
          # The first scene in the list becomes the initial scene.
          job=$(curl -sfS -X POST \
            -H "Authorization: Bearer ${PC_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc \
                  --argjson project_id "${PC_PROJECT_ID}" \
                  --argjson scenes "[${SCENE_ID}]" \
                  --arg name "${PC_APP_NAME}" \
                  '{project_id: $project_id, name: $name, scenes: $scenes,
                    scripts_minify: true, optimize_scene_format: true}')" \
            "https://playcanvas.com/api/apps/download")
          job_id=$(echo "${job}" | jq -r '.id')
          test -n "${job_id}" && test "${job_id}" != "null" || {
            echo "No job id in response: ${job}"; exit 1; }
          echo "JOB_ID=${job_id}" >> "$GITHUB_ENV"

      - name: Wait for the export to finish
        env:
          PC_TOKEN: ${{ secrets.PLAYCANVAS_API_TOKEN }}
        run: |
          # PlayCanvas's own tools poll at 1s, but free accounts are rate
          # limited to as little as 5 req/min on strict endpoints, so back off.
          for _ in $(seq 1 60); do
            resp=$(curl -sfS -H "Authorization: Bearer ${PC_TOKEN}" \
              "https://playcanvas.com/api/jobs/${JOB_ID}")
            case "$(echo "${resp}" | jq -r '.status')" in
              complete)
                # apps/download exposes the zip at .data.download_url.
                # projects/:id/export uses .data.url instead - same job shape,
                # different key. Do not swap these.
                echo "DOWNLOAD_URL=$(echo "${resp}" | jq -r '.data.download_url')" \
                  >> "$GITHUB_ENV"
                exit 0 ;;
              error)
                echo "Export failed:"; echo "${resp}" | jq -r '.messages[]?'; exit 1 ;;
            esac
            sleep 5
          done
          echo "Export job ${JOB_ID} did not finish within 5 minutes"; exit 1

      - name: Download and unpack the build
        run: |
          curl -sfSL -o app.zip "${DOWNLOAD_URL}"
          mkdir -v -p build/web
          unzip -q app.zip -d build/web
          # The zip may nest the app under a folder; flatten so index.html is at
          # the root of what butler pushes, or itch serves a blank page.
          idx=$(find build/web -maxdepth 3 -name index.html | head -1)
          test -n "${idx}" || { echo "No index.html in the exported build"; exit 1; }
          dir=$(dirname "${idx}")
          if [ "${dir}" != "build/web" ]; then
            mv "${dir}"/* build/web/
          fi

      - name: Fail early if the export produced nothing
        run: test -s build/web/index.html || { echo "Export produced no index.html"; exit 1; }

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

  # Unchanged from the Godot pipeline.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: Install butler
        run: |
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler-bin
          chmod +x butler-bin/butler
          ./butler-bin/butler -V

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          ./butler-bin/butler push build/web \
            "${ITCH_USER}/${ITCH_GAME}:${ITCH_CHANNEL}"
