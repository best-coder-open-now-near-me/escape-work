name: CI

# The merge gate: every PR (and main) must pass unit tests, build, and the
# headless Playwright smoke suite before deploy.yml ships anything.
on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build web bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # Both: the HTML report (rendered run, with the traces linked) and
          # the raw per-test artifacts (trace.zip, screenshots, video).
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
