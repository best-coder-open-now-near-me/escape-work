<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Escape Work</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1a1a26; overflow: hidden; }
    #app { width: 100%; height: 100%; display: block; touch-action: none; }
    #hud {
      position: fixed; top: 14px; left: 0; right: 0; text-align: center;
      pointer-events: none; color: #f0f0f5;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    #hud h1 { margin: 0; font-size: 22px; letter-spacing: 3px; font-weight: 700; }
    #hud p  { margin: 6px 0 0; font-size: 13px; letter-spacing: 1px; opacity: .65; }
  </style>
</head>
<body>
  <div id="hud">
    <h1>ESCAPE&nbsp;WORK</h1>
    <p id="subtitle">loading&hellip;</p>
  </div>
  <canvas id="app"></canvas>
  <script src="playcanvas.min.js"></script>
  <script src="bundle.js"></script>
</body>
</html>
