name: Build and Deploy to itch.io

# Deploys only what CI has actually verified. This used to run on `push` in
# PARALLEL with ci.yml, so a push whose e2e suite failed still shipped to
# itch.io - the "merge gate" only ever gated pull requests. Chaining off CI's
# completion makes the gate real for direct pushes too.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [ main ]
  workflow_dispatch:

# One deploy at a time, newest wins: two quick pushes could otherwise race
# butler and land out of order.
concurrency:
  group: deploy-itch
  cancel-in-progress: false

env:
  # NB: the itch username ("nr") differs from the GitHub org ("near").
  ITCH_USER: best-coder-open-now-nr-me
  ITCH_GAME: escape-work
  ITCH_CHANNEL: html5

jobs:
  # The whole game is in this repo now (code-first PlayCanvas), so CI just
  # installs deps and bundles it into build/web. Nothing talks to PlayCanvas's
  # cloud anymore.
  build:
    runs-on: ubuntu-latest
    # workflow_run fires on success AND failure - only ship a green CI run.
    # (A manual workflow_dispatch has no triggering run and passes through.)
    #
    # The event and head_repository checks are what make this safe on a PUBLIC
    # repo. `branches: [main]` above filters the triggering run's HEAD branch,
    # and a fork's branch can be called "main" too - so a stranger could open a
    # PR from fork:main, CI would run it, this workflow would fire, check out
    # THEIR commit, and push it to our itch.io page using BUTLER_API_KEY.
    # Requiring a `push` event from this repository closes that: fork PRs
    # trigger `pull_request` runs owned by the fork, never a push to ours.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    steps:
      - name: Checkout
        # Build the exact commit CI verified, not whatever main points at now.
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build web bundle
        run: npm run build

      - name: Fail early if the build produced nothing
        run: test -s build/web/index.html || { echo "Build produced no index.html"; exit 1; }

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

  # Unchanged: butler pushes a directory and does not care what produced it.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: Install butler
        # Pinned (not LATEST) so deploys are reproducible and the binary that
        # touches the itch.io API key doesn't change out from under us.
        run: |
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/15.21.0/archive/default
          unzip -q butler.zip -d butler-bin
          chmod +x butler-bin/butler
          ./butler-bin/butler -V

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          ./butler-bin/butler push build/web \
            "${ITCH_USER}/${ITCH_GAME}:${ITCH_CHANNEL}"
